<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Admin — Images Anime Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #0d1117; color: #f3f4f6; min-height: 100vh; padding: 24px; }
    h1 { font-size: 20px; font-weight: 800; color: #06b6d4; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #475569; margin-bottom: 28px; }
    .section { background: #161b27; border: 1px solid rgba(255,255,255,0.07); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .section-title { font-size: 11px; color: #475569; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 14px; }
    input[type="text"], input[type="url"] { width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #06b6d4; }
    input::placeholder { color: #334155; }
    .form-row { display: flex; gap: 10px; margin-top: 10px; }
    .form-row input { flex: 1; }
    .btn { padding: 10px 20px; border-radius: 10px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .btn-primary { background: linear-gradient(135deg, #06b6d4, #0891b2); color: #fff; }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.1); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { font-size: 13px; margin-top: 8px; min-height: 18px; }
    .msg.ok  { color: #10b981; }
    .msg.err { color: #f87171; }
    .preview { margin-top: 10px; height: 80px; border-radius: 8px; overflow: hidden; background: rgba(0,0,0,0.2); display: none; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.06); }
    .preview img { height: 100%; object-fit: contain; }
    .list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); transition: border-color 0.15s; }
    .item:hover { border-color: rgba(6,182,212,0.3); }
    .item-thumb { width: 40px; height: 56px; object-fit: cover; border-radius: 6px; background: #1e2636; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.08); }
    .item-info { flex: 1; min-width: 0; }
    .item-title { font-size: 14px; font-weight: 600; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub   { font-size: 11px; color: #475569; margin-top: 2px; }
    .item-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
    .badge-missing { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .badge-ok      { background: rgba(16,185,129,0.12); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
    .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .edit-btn { background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.3); color: #06b6d4; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .edit-btn:hover { background: rgba(6,182,212,0.2); }
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .tab { padding: 7px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: none; color: #475569; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .tab.active { background: rgba(6,182,212,0.12); border-color: rgba(6,182,212,0.4); color: #06b6d4; }
    .empty { color: #334155; font-size: 13px; padding: 8px 0; }
    #loadingMsg { text-align: center; color: #475569; padding: 20px; }
  </style>
</head>
<body>
  <h1>🖼 Admin — Base d'images</h1>
  <p class="subtitle">Collection Firestore <code>image_globale</code> — les images définies ici sont utilisées par tous les utilisateurs.</p>

  <div class="section">
    <div class="section-title">Ajouter / Modifier une image</div>
    <input id="formTitle" type="text" placeholder="Titre exact de l'animé (ex: Overlord) — pour un film : « Titre — Film 1 »" />
    <div class="form-row">
      <input id="formSeason" type="text" placeholder="Saison (1 par défaut)" style="max-width:140px;" />
      <input id="formUrl" type="url" placeholder="URL de l'image (https://...)" />
    </div>
    <div id="previewWrap" class="preview"><img id="previewImg" src="" alt="Aperçu" /></div>
    <div style="margin-top:12px;"><button id="saveBtn" class="btn btn-primary">Enregistrer</button></div>
    <div id="saveMsg" class="msg"></div>
  </div>

  <div class="section">
    <div class="tabs">
      <button class="tab active" data-tab="missing">⚠️ À remplir</button>
      <button class="tab" data-tab="all">✅ Toutes les images</button>
    </div>
    <div id="listContainer"><div id="loadingMsg">Chargement...</div></div>
  </div>

  <script>
  // Même projet et même collection que l'extension (background.js)
  const FIREBASE_API_KEY = "AIzaSyCNTOWxHmQ7jlskBYXTUpw6VIUX1IVIfHA";
  const FIREBASE_PROJECT = "anime-tracker-1894a";
  const FIRESTORE_URL    = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;

  let currentTab = 'missing';
  let allDocs = [];

  // IDENTIQUE à titleToKey() de background.js
  function hashStr(s) { let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return Math.abs(h).toString(36); }
  function titleToKey(title, season) {
    const raw = (title || '').toLowerCase().trim();
    let base = raw.replace(/\s+/g, '_').replace(/[^\w]/g, '').slice(0, 100);
    if (!base && raw) base = 't' + hashStr(raw);
    return season && season > 1 ? `${base}_s${season}` : base;
  }

  async function loadAll() {
    document.getElementById('loadingMsg') && (document.getElementById('loadingMsg').textContent = 'Chargement...');
    try {
      const docs = [];
      let pageToken = '';
      do {
        const url = `${FIRESTORE_URL}/image_globale?pageSize=300&key=${FIREBASE_API_KEY}${pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : ''}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        docs.push(...(data.documents || []));
        pageToken = data.nextPageToken || '';
      } while (pageToken);
      allDocs = docs.map(d => ({
        title:        d.fields?.title?.stringValue || '',
        season:       parseInt(d.fields?.season?.integerValue || 1, 10),
        image:        d.fields?.image?.stringValue || '',
        currentImage: d.fields?.currentImage?.stringValue || '',
        requestCount: parseInt(d.fields?.requestCount?.integerValue || 0, 10),
        reported:     d.fields?.reported?.booleanValue || false,
        lastRequestAt:parseInt(d.fields?.lastRequestAt?.integerValue || 0, 10)
      }));
      renderList();
    } catch (e) {
      document.getElementById('listContainer').innerHTML = '<div id="loadingMsg">Erreur chargement: ' + e.message + '</div>';
    }
  }

  function renderList() {
    const container = document.getElementById('listContainer');
    const toShow = currentTab === 'missing' ? allDocs.filter(d => !d.image) : allDocs.filter(d => !!d.image);
    if (!toShow.length) {
      container.innerHTML = `<p class="empty">${currentTab === 'missing' ? 'Aucune image à remplir 🎉' : 'Aucune image enregistrée.'}</p>`;
      return;
    }
    // Les plus demandés en premier dans « À remplir »
    toShow.sort((a, b) => currentTab === 'missing'
      ? (b.requestCount - a.requestCount) || (a.title || '').localeCompare(b.title || '')
      : (a.title || '').localeCompare(b.title || ''));

    const list = document.createElement('div'); list.className = 'list';
    for (const doc of toShow) {
      const item = document.createElement('div'); item.className = 'item';
      const thumb = document.createElement('img'); thumb.className = 'item-thumb';
      thumb.src = doc.image || doc.currentImage || '';
      thumb.onerror = () => { thumb.style.visibility = 'hidden'; };

      const info = document.createElement('div'); info.className = 'item-info';
      const title = document.createElement('div'); title.className = 'item-title';
      title.textContent = doc.title + (doc.season > 1 ? ` — Saison ${doc.season}` : '');
      const sub = document.createElement('div'); sub.className = 'item-sub';
      const badge = document.createElement('span');
      if (doc.image) {
        badge.className = 'item-badge badge-ok'; badge.textContent = '✓ Image OK';
        sub.textContent = doc.image.length > 50 ? doc.image.slice(0, 50) + '…' : doc.image;
      } else {
        badge.className = 'item-badge badge-missing'; badge.textContent = doc.reported ? '⚠ Signalée' : '⚠ Image manquante';
        const parts = [];
        if (doc.requestCount) parts.push(`${doc.requestCount} demande(s)`);
        if (doc.lastRequestAt) parts.push(`dernière le ${new Date(doc.lastRequestAt).toLocaleDateString('fr-FR')}`);
        sub.textContent = parts.join(' — ');
      }
      info.appendChild(title); info.appendChild(badge); if (sub.textContent) info.appendChild(sub);

      const actions = document.createElement('div'); actions.className = 'item-actions';
      const editBtn = document.createElement('button'); editBtn.className = 'edit-btn'; editBtn.textContent = '✏️ Remplir';
      editBtn.addEventListener('click', () => {
        document.getElementById('formTitle').value  = doc.title;
        document.getElementById('formSeason').value = doc.season > 1 ? doc.season : '1';
        document.getElementById('formUrl').value    = doc.image || '';
        if (doc.image) { document.getElementById('previewImg').src = doc.image; document.getElementById('previewWrap').style.display = 'flex'; }
        document.getElementById('formTitle').scrollIntoView({ behavior: 'smooth' });
        document.getElementById('formUrl').focus();
      });
      actions.appendChild(editBtn);
      item.appendChild(thumb); item.appendChild(info); item.appendChild(actions);
      list.appendChild(item);
    }
    container.innerHTML = '';
    container.appendChild(list);
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      renderList();
    });
  });

  document.getElementById('formUrl').addEventListener('input', () => {
    const url = document.getElementById('formUrl').value.trim();
    const wrap = document.getElementById('previewWrap');
    if (url.startsWith('http')) { document.getElementById('previewImg').src = url; wrap.style.display = 'flex'; }
    else wrap.style.display = 'none';
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const title  = document.getElementById('formTitle').value.trim();
    const season = parseInt(document.getElementById('formSeason').value || '1', 10) || 1;
    const url    = document.getElementById('formUrl').value.trim();
    const msg    = document.getElementById('saveMsg');
    msg.className = 'msg'; msg.textContent = '';
    if (!title) { msg.className = 'msg err'; msg.textContent = 'Titre requis'; return; }
    if (!url.startsWith('http')) { msg.className = 'msg err'; msg.textContent = 'URL invalide'; return; }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = 'Enregistrement…';
    const key = titleToKey(title, season);
    // updateMask : on ne touche que ces champs (requestCount, currentImage… sont conservés)
    const mask = ['title', 'season', 'image', 'reported', 'updatedAt'].map(f => `updateMask.fieldPaths=${f}`).join('&');
    try {
      const res = await fetch(`${FIRESTORE_URL}/image_globale/${key}?${mask}&key=${FIREBASE_API_KEY}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: {
          title:     { stringValue: title },
          season:    { integerValue: String(season) },
          image:     { stringValue: url },
          reported:  { booleanValue: false },
          updatedAt: { integerValue: String(Date.now()) }
        } })
      });
      if (!res.ok) throw new Error((await res.json()).error?.message || 'Erreur Firestore');
      msg.className = 'msg ok'; msg.textContent = `✓ Image enregistrée pour "${title}"`;
      document.getElementById('formTitle').value = '';
      document.getElementById('formUrl').value = '';
      document.getElementById('formSeason').value = '';
      document.getElementById('previewWrap').style.display = 'none';
      await loadAll();
    } catch (e) {
      msg.className = 'msg err'; msg.textContent = e.message;
    } finally { btn.disabled = false; btn.textContent = 'Enregistrer'; }
  });

  loadAll();
  </script>
</body>
</html>
